name: ChromePie checks
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          bash -n tools/bootstrap.sh
          bash -n tools/build.sh
          python3 -m py_compile tools/check_upstream.py tools/native_gate.py
      - name: Android encoder guard unit tests
        run: python3 tools/api28_encoder_guard.py --self-test
      - name: Native gate unit tests
        run: python3 tools/native_gate.py --self-test
      - name: APK gate unit tests
        run: python3 tools/apk_gate.py --self-test
      - name: NDK symbol audit unit tests
        run: python3 tools/ndk_symbol_audit.py --self-test
      - name: Check pinned upstream
        run: python3 tools/check_upstream.py
