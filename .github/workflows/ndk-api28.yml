name: Chromium 159 NDK API28
on:
  push:
    paths:
      - '.github/workflows/ndk-api28.yml'
      - 'tools/ndk_symbol_audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ndk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Chromium NDK
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          export PATH="$RUNNER_TEMP/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          mkdir -p "$RUNNER_TEMP/chromium-ndk"
          printf '%s\n' 'chromium/third_party/android_toolchain/android_toolchain/linux-amd64 -33zVUIjuaq6ZsJfN7ldhELUrkVuY1knWj8x7E500i0C' > "$RUNNER_TEMP/ndk.ensure"
          cipd ensure -root "$RUNNER_TEMP/chromium-ndk" -ensure-file "$RUNNER_TEMP/ndk.ensure"
          echo "CHROMEPIE_NDK=$RUNNER_TEMP/chromium-ndk" >> "$GITHUB_ENV"
      - name: Download pinned Chromium Clang and Android runtimes
        shell: bash
        run: |
          set -euxo pipefail
          src="$RUNNER_TEMP/clang-source/src"
          mkdir -p "$src/tools/clang/scripts"
          printf '%s\n' 'target_os = ["android"]' > "$src/.gclient"
          if ! curl -fLsS --retry 2 --connect-timeout 20 --max-time 60 'https://raw.githubusercontent.com/chromium/chromium/159.0.8154.33/tools/clang/scripts/update.py' -o "$src/tools/clang/scripts/update.py"; then
            echo 'GitHub mirror unavailable; fetching the same pinned tag from Chromium Gitiles.'
            curl -fLsS --retry 3 --connect-timeout 20 --max-time 60 'https://chromium.googlesource.com/chromium/src/+/refs/tags/159.0.8154.33/tools/clang/scripts/update.py?format=TEXT' | base64 --decode > "$src/tools/clang/scripts/update.py"
          fi
          python3 -m py_compile "$src/tools/clang/scripts/update.py"
          grep -F "CLANG_REVISION = 'llvmorg-24-init-17044-gc3223914'" "$src/tools/clang/scripts/update.py"
          python3 "$src/tools/clang/scripts/update.py" --host-os linux --output-dir "$RUNNER_TEMP/chromium-clang"
          echo "CHROMEPIE_CLANG=$RUNNER_TEMP/chromium-clang" >> "$GITHUB_ENV"
      - name: Compile and link with Chromium Clang and API28 NDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ndk-report
          tc="$CHROMEPIE_NDK/toolchains/llvm/prebuilt/linux-x86_64"
          cc="$CHROMEPIE_CLANG/bin/clang"
          test -d "$tc/sysroot/usr/lib/aarch64-linux-android/28"
          test -x "$cc"
          "$cc" --version | tee ndk-report/clang.txt
          ls -la "$tc/sysroot/usr/lib/aarch64-linux-android/28" > ndk-report/api28-libs.txt
          cat > ndk-report/api28.c <<'EOF'
          #include <android/hardware_buffer.h>
          #if __ANDROID_API__ != 28
          #error Unexpected Android API
          #endif
          void pie_acquire(AHardwareBuffer* b) { AHardwareBuffer_acquire(b); }
          EOF
          "$cc" --target=aarch64-linux-android28 --sysroot="$tc/sysroot" -fuse-ld=lld -unwindlib=none -fPIC -shared -Wl,--no-undefined ndk-report/api28.c -landroid -o ndk-report/libapi28.so
          readelf -h -d -Ws ndk-report/libapi28.so > ndk-report/elf.txt
          grep -q AArch64 ndk-report/elf.txt
          grep -q AHardwareBuffer_acquire ndk-report/elf.txt
          echo 'Chromium Clang + NDK API 28 C-only smoke link passed (not a Chromium build; unwind not tested).' | tee ndk-report/result.txt
      - name: Validate symbol audit on real API28 and API29 ELF files
        shell: bash
        run: |
          set -euxo pipefail
          tc="$CHROMEPIE_NDK/toolchains/llvm/prebuilt/linux-x86_64"
          cc="$CHROMEPIE_CLANG/bin/clang"
          cat > ndk-report/api29.c <<'EOF'
          #include <android/hardware_buffer.h>
          int pie_lock(AHardwareBuffer* buffer, AHardwareBuffer_Planes* planes) {
            return AHardwareBuffer_lockPlanes(buffer, AHARDWAREBUFFER_USAGE_CPU_READ_OFTEN, -1, 0, planes);
          }
          EOF
          "$cc" --target=aarch64-linux-android29 --sysroot="$tc/sysroot" -fuse-ld=lld -unwindlib=none -fPIC -shared -Wl,--no-undefined ndk-report/api29.c -landroid -o ndk-report/libapi29.so
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          for api in (28, 29):
              p = Path(f'ndk-report/libapi{api}.so')
              # Synthetic ZIP fixture for ELF scanning only, not an installable APK.
              with zipfile.ZipFile(f'ndk-report/api{api}-fixture.zip','w') as z:
                  z.write(p, 'lib/arm64-v8a/' + p.name)
          PY
          for api in 28 29; do
            python3 tools/ndk_symbol_audit.py "ndk-report/api${api}-fixture.zip" --sysroot "$tc/sysroot" > "ndk-report/audit-api${api}.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          def load(api):
              return json.loads(Path(f'ndk-report/audit-api{api}.json').read_text())
          old, new = load(28), load(29)
          assert old['strong_unmatched'] == 0, old
          assert not old['unmatched_needed'], old
          assert any(x['symbol'] == 'AHardwareBuffer_lockPlanes' and x['binding'] == 'GLOBAL'
                     for x in new['unmatched_imports']), new
          print('API28 accepted; API29-only hardware buffer import detected.')
          PY
      - name: Check Bionic device API level compatibility
        shell: bash
        run: |
          set -euxo pipefail
          tc="$CHROMEPIE_NDK/toolchains/llvm/prebuilt/linux-x86_64"
          cc="$CHROMEPIE_CLANG/bin/clang"
          cat > ndk-report/bionic.c <<'EOF'
          #include <android/api-level.h>
          int pie_device_sdk(void) {
            return android_get_device_api_level();
          }
          EOF
          for api in 28 29; do
            "$cc" --target="aarch64-linux-android${api}" --sysroot="$tc/sysroot" -fuse-ld=lld -unwindlib=none -Werror=unguarded-availability -O2 -fPIC -shared -Wl,--no-undefined ndk-report/bionic.c -o "ndk-report/libbionic${api}.so"
            readelf -W --dyn-syms "ndk-report/libbionic${api}.so" > "ndk-report/bionic${api}-symbols.txt"
          done
          python3 - <<'PY'
          from pathlib import Path
          from tools.ndk_symbol_audit import symbols
          def imports(api):
              return symbols(Path(f'ndk-report/bionic{api}-symbols.txt').read_text())[1]
          pie, q = imports(28), imports(29)
          assert not any(name == 'android_get_device_api_level' and binding == 'GLOBAL'
                         for binding, name, version in pie), pie
          assert not any(version.startswith('LIBC_Q') and binding == 'GLOBAL'
                         for binding, name, version in pie), pie
          print('API28 imports:', pie)
          print('API29 imports:', q)
          print('No strong API29 device-level dependency in the API28 fixture.')
          PY
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndk-api28-report
          path: ndk-report/
          if-no-files-found: ignore
          retention-days: 3
