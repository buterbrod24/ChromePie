name: Chromium 159 NDK API28
on:
  push:
    paths:
      - '.github/workflows/ndk-api28.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ndk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Download pinned Chromium NDK
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          export PATH="$RUNNER_TEMP/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          mkdir -p "$RUNNER_TEMP/chromium-ndk"
          printf '%s\n' 'chromium/third_party/android_toolchain/android_toolchain/linux-amd64 -33zVUIjuaq6ZsJfN7ldhELUrkVuY1knWj8x7E500i0C' > "$RUNNER_TEMP/ndk.ensure"
          cipd ensure -root "$RUNNER_TEMP/chromium-ndk" -ensure-file "$RUNNER_TEMP/ndk.ensure"
          echo "CHROMEPIE_NDK=$RUNNER_TEMP/chromium-ndk" >> "$GITHUB_ENV"
      - name: Download pinned Chromium Clang and Android runtimes
        shell: bash
        run: |
          set -euxo pipefail
          src="$RUNNER_TEMP/clang-source/src"
          mkdir -p "$src/tools/clang/scripts"
          printf '%s\n' 'target_os = ["android"]' > "$src/.gclient"
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/chromium/chromium/159.0.8154.33/tools/clang/scripts/update.py' -o "$src/tools/clang/scripts/update.py"
          grep -F "CLANG_REVISION = 'llvmorg-24-init-17044-gc3223914'" "$src/tools/clang/scripts/update.py"
          python3 "$src/tools/clang/scripts/update.py" --host-os linux --output-dir "$RUNNER_TEMP/chromium-clang"
          echo "CHROMEPIE_CLANG=$RUNNER_TEMP/chromium-clang" >> "$GITHUB_ENV"
      - name: Compile and link with Chromium Clang and API28 NDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ndk-report
          tc="$CHROMEPIE_NDK/toolchains/llvm/prebuilt/linux-x86_64"
          cc="$CHROMEPIE_CLANG/bin/clang"
          test -d "$tc/sysroot/usr/lib/aarch64-linux-android/28"
          test -x "$cc"
          "$cc" --version | tee ndk-report/clang.txt
          ls -la "$tc/sysroot/usr/lib/aarch64-linux-android/28" > ndk-report/api28-libs.txt
          cat > ndk-report/api28.c <<'EOF'
          #include <android/hardware_buffer.h>
          #if __ANDROID_API__ != 28
          #error Unexpected Android API
          #endif
          void pie_acquire(AHardwareBuffer* b) { AHardwareBuffer_acquire(b); }
          EOF
          "$cc" --target=aarch64-linux-android28 --sysroot="$tc/sysroot" -fuse-ld=lld -fPIC -shared -Wl,--no-undefined ndk-report/api28.c -landroid -o ndk-report/libapi28.so
          readelf -h -d -Ws ndk-report/libapi28.so > ndk-report/elf.txt
          grep -q AArch64 ndk-report/elf.txt
          grep -q AHardwareBuffer_acquire ndk-report/elf.txt
          echo 'Chromium Clang + NDK API 28 smoke link passed (not a Chromium build).' | tee ndk-report/result.txt
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndk-api28-report
          path: ndk-report/
          if-no-files-found: ignore
          retention-days: 3
